map $http_accept $is_api {
    default 1;
    "~*text/html" 0;
}

server {
    listen 80;
    client_max_body_size 20M;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # API proxy – ohne trailing slash, damit /strains und /strains/{id} matchen
    location /auth {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser-Navigation (Accept: text/html) auf kollidierende SPA-/API-Pfade
    # wird via error_page an den SPA-Fallback umgeleitet, sonst ans Backend.
    location = /strains {
        error_page 418 = @spa;
        if ($is_api = 0) { return 418; }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /seeds {
        error_page 418 = @spa;
        if ($is_api = 0) { return 418; }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /grows {
        error_page 418 = @spa;
        if ($is_api = 0) { return 418; }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Detail-Seiten (?/strains/{id}, /grows/{id}) kollidieren mit API-Routen.
    # Regex matcht nur UUID-IDs; Browser-Navigation geht an den SPA-Fallback.
    location ~ "^/(strains|grows)/([0-9a-fA-F-]{36})$" {
        error_page 418 = @spa;
        if ($is_api = 0) { return 418; }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Weitere API-Segmente unter /strains, /seeds, /grows (z. B. /grows/{id}/weeks)
    location /strains/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /seeds/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /grows/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /search {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback – erst nach den API-Locations
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ziel für Browser-Navigation auf kollidierende SPA-/API-Pfade
    location @spa {
        try_files $uri $uri/ /index.html;
    }
}
